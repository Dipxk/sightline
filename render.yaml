services:
  - type: web
    name: sightline-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./sightline.db
      - key: PORT
        value: "8000"
